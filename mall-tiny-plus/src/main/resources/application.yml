server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:15432/${PG_DATABASE:mall_tiny}?currentSchema=${PG_SCHEMA:public}
    username: ${PG_USER:mall_app}
    password: ${PG_PASSWORD}

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml #指定mapper.xml路径
  global-config:
    db-config:
      id-type: auto #全局默认主键类型设置为自增
  configuration:
    auto-mapping-behavior: partial #只对非嵌套的 resultMap 进行自动映射
    map-underscore-to-camel-case: true #开启自动驼峰命名规则映射

springdoc:
  packages-to-scan: com.macro.mall.tiny.modules
